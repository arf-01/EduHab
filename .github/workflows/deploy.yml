name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  laravel-tests:
    name: PHP Tests & Build (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quiz_app_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies
        run: npm ci

      - name: Compile Frontend Assets (Vite)
        run: npm run build

      - name: Code Style Check (Laravel Pint)
        run: php vendor/bin/pint --test

      - name: Copy Testing Environment
        run: php -r "file_exists('.env.testing') || copy('.env.example', '.env.testing');"

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quiz_app_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force --env=testing

      - name: Execute Unit and Integration Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quiz_app_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  deploy:
    name: Deploy to Production
    needs: laravel-tests
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arf-01/eduhub:${{ github.sha }}
            ghcr.io/arf-01/eduhub:latest

      - name: Upload deployment definition
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.production.yml,docker"
          target: "/var/www/quiz-app"

      - name: Deploy image to Azure VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/quiz-app

            export IMAGE_NAME="ghcr.io/arf-01/eduhub"
            export IMAGE_TAG="${{ github.sha }}"

            echo "==> Pulling production image..."
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io \
              --username "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f docker-compose.production.yml pull

            echo "==> Starting MySQL..."
            docker compose -f docker-compose.production.yml up -d mysql

            echo "==> Waiting for MySQL..."
            until docker compose -f docker-compose.production.yml exec -T mysql \
              sh -c 'mysqladmin ping -h localhost -u root -p"$MYSQL_ROOT_PASSWORD" --silent'
            do
              sleep 5
            done

            echo "==> Running database migrations..."
            docker compose -f docker-compose.production.yml run --rm --no-deps app \
              php artisan migrate --force

            echo "==> Rebuilding application services..."
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            echo "==> Linking public storage..."
            docker compose -f docker-compose.production.yml exec -T app \
              php artisan storage:link

            echo "==> Warming Laravel caches..."
            docker compose -f docker-compose.production.yml exec -T app \
              php artisan config:cache
            docker compose -f docker-compose.production.yml exec -T app \
              php artisan route:cache
            docker compose -f docker-compose.production.yml exec -T app \
              php artisan view:cache

            echo "==> Deployment finished successfully!"
