services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  public-assets:
    image: ${IMAGE_NAME:-ghcr.io/arf-01/eduhub}:${IMAGE_TAG:-latest}
    user: root
    command: >
      sh -c "cp -a /var/www/html/public/. /shared/
      && chown -R www-data:www-data /shared"
    volumes:
      - public_assets:/shared
    networks:
      - app

  app:
    image: ${IMAGE_NAME:-ghcr.io/arf-01/eduhub}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - public_assets:/var/www/html/public
      - app_storage:/var/www/html/storage/app
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      public-assets:
        condition: service_completed_successfully
    networks:
      - app

  queue:
    image: ${IMAGE_NAME:-ghcr.io/arf-01/eduhub}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      public-assets:
        condition: service_completed_successfully
    networks:
      - app

  scheduler:
    image: ${IMAGE_NAME:-ghcr.io/arf-01/eduhub}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      public-assets:
        condition: service_completed_successfully
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      public-assets:
        condition: service_completed_successfully
    networks:
      - app

volumes:
  mysql_data:
  public_assets:
  app_storage:

networks:
  app:
